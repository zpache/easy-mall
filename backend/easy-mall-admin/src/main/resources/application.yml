server:
  port: 8081
  servlet:
    context-path: /admin
    encoding:
      charset: UTF-8
      force: true

spring:
  application:
    name: easy-mall-admin
  profiles:
    # local 存放本机私有配置（数据库密码等），已被 gitignore，缺失时不影响启动
    active: dev,local
  jackson:
    time-zone: Asia/Shanghai
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    # 下划线转驼峰；开发期开启 SQL 日志方便排查
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  mapper-locations: classpath*:/mapper/**/*.xml

easy-mall:
  jwt:
    # 生产环境通过环境变量 JWT_SECRET 注入，长度至少 32 字节
    secret: ${JWT_SECRET:easy-mall-admin-dev-only-secret-key-0123456789abcdef}
    issuer: easy-mall-admin
    admin-expire: 12h
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:*}
  upload:
    # 本地上传目录，默认 ~/easy-mall/uploads；生产环境建议挂载独立数据盘或改接对象存储
    dir: ${UPLOAD_DIR:${user.home}/easy-mall/uploads}
    # 对外访问前缀，须与实际 context-path 保持一致
    url-prefix: ${UPLOAD_URL_PREFIX:/admin/uploads}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

# 日志：级别、格式、滚动策略统一在 logback-spring.xml 维护，这里不再配置 logging.*
