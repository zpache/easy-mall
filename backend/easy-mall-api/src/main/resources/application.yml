server:
  port: 8082
  servlet:
    context-path: /api
    encoding:
      charset: UTF-8
      force: true

spring:
  application:
    name: easy-mall-api
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      timeout: 3s
  profiles:
    # local 存放本机私有配置（数据库密码等），已被 gitignore，缺失时不影响启动
    active: dev,local
  jackson:
    time-zone: Asia/Shanghai
  servlet:
    multipart:
      # 头像上传走 multipart，容器层限制略大于业务校验（业务限制见 easy-mall.upload.avatar-max-size）
      max-file-size: 5MB
      max-request-size: 10MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  mapper-locations: classpath*:/mapper/**/*.xml

easy-mall:
  # 小程序自定义登录态（Redis 会话）：code 换 openid 后签发不透明 token，
  # 有效期 / 续期 / 踢下线均由服务端控制，替代自包含 JWT
  session:
    ttl: ${SESSION_TTL:7d}
    single-device: ${SESSION_SINGLE_DEVICE:true}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:*}
  security:
    # 免登录接口（路径不含 context-path /api）
    ignore-urls:
      - /auth/login
      - /home
      - /categories
      - /goods
      - /goods/**
      - /decorate
      - /decorate/**
      - /v3/api-docs/**
      - /swagger-ui/**
      - /swagger-ui.html
      - /actuator/health
      # 微信支付回调：微信服务器无法携带登录态，安全性由回调报文验签保证
      - /pay/wxpay/notify
      # 头像等本地上传文件：image 组件无法携带 token，静态资源放开
      - /files/**
  wx:
    app-id: ${WX_APP_ID:}
    app-secret: ${WX_APP_SECRET:}
    # 默认走真实微信 jscode2session 换取 openid；
    # 仅当本地没有小程序凭证、需要免凭证联调时才显式设置 WX_MOCK=true
    mock: ${WX_MOCK:false}
  upload:
    # 上传文件落盘目录（相对进程工作目录，已 gitignore）
    dir: ${UPLOAD_DIR:./uploads}
    # 对外访问前缀；留空则按当前请求的协议 + host 自动拼装，真机/内网穿透无需改配置
    public-base: ${UPLOAD_PUBLIC_BASE:}
    avatar-max-size: ${UPLOAD_AVATAR_MAX_SIZE:2097152}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

# 日志：级别、格式、滚动策略统一在 logback-spring.xml 维护，这里不再配置 logging.*
