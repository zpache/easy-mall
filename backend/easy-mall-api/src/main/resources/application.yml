server:
  port: 8082
  servlet:
    context-path: /api
    encoding:
      charset: UTF-8
      force: true

spring:
  application:
    name: easy-mall-api
  profiles:
    # local 存放本机私有配置（数据库密码等），已被 gitignore，缺失时不影响启动
    active: dev,local
  jackson:
    time-zone: Asia/Shanghai

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  mapper-locations: classpath*:/mapper/**/*.xml

easy-mall:
  jwt:
    # 与 admin 使用不同密钥，两端的 token 不能互相通用
    secret: ${JWT_SECRET:easy-mall-api-dev-only-secret-key-0123456789abcdef}
    issuer: easy-mall-api
    expire: 7d
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:*}
  security:
    # 免登录接口（路径不含 context-path /api）
    ignore-urls:
      - /auth/login
      - /home
      - /categories
      - /goods
      - /goods/**
      - /decorate
      - /decorate/**
      - /v3/api-docs/**
      - /swagger-ui/**
      - /swagger-ui.html
      - /actuator/health
  wx:
    app-id: ${WX_APP_ID:}
    app-secret: ${WX_APP_SECRET:}
    # 本地开发用模拟登录，生产环境必须设为 false
    mock: ${WX_MOCK:true}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

# 日志：级别、格式、滚动策略统一在 logback-spring.xml 维护，这里不再配置 logging.*
