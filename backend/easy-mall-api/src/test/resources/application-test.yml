spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:easy_mall_api;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
  sql:
    init:
      mode: always
      schema-locations: classpath:schema-h2.sql
  # 自定义登录态存 Redis，测试依赖本机 Redis（redis-server 默认端口）
  data:
    redis:
      host: 127.0.0.1
      port: 6379

easy-mall:
  wx:
    mock: true

logging:
  level:
    com.easymall.api: info
    org.springframework: warn
