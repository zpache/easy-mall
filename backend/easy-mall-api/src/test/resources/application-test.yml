spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:easy_mall_api;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
  sql:
    init:
      mode: always
      schema-locations: classpath:schema-h2.sql

easy-mall:
  wx:
    mock: true

logging:
  level:
    com.easymall.api: info
    org.springframework: warn
